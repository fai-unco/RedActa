<div *ngIf="!loading" class="d-flex flex-column h-100" style="gap: 1rem;">
    <div *ngIf="groups.length > 0" class="scrollable">
        <nb-card>
            <nb-card-header class="d-flex justify-content-between">
                Lista de grupos
                <div nbTooltip="Agregar grupo">
                    <button nbButton ghost status="primary" (click)="openEditGroupDialog()">
                        <nb-icon icon="plus-outline"></nb-icon>
                    </button>
                </div>
            </nb-card-header>
            <nb-list>
                <nb-list-item *ngFor="let group of groups">
                    <div class="w-100 d-flex justify-content-between">
                        <b class="ml-2">{{group.name}}</b>
                        <div class="d-flex">
                            <div nbTooltip="Editar grupo">
                                <button nbButton ghost status="primary" (click)="openEditGroupDialog(group)">
                                    <nb-icon icon="edit-outline"></nb-icon>
                                </button>
                            </div>
                            <div nbTooltip="Eliminar grupo">
                                <button class="ghost-btn" nbButton ghost (click)="openRemoveGroupDialog(group)">
                                    <nb-icon icon="trash-2-outline" status="primary"></nb-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                </nb-list-item>
            </nb-list>
        </nb-card>
    </div>
</div>
<div class="d-flex justify-content-center" *ngIf="loading">
    <nb-spinner status="primary"></nb-spinner>
</div>
