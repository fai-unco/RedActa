<div *ngIf="!loading" class="d-flex flex-column h-100" style="gap: 1rem;">
    <div class="d-flex" style="gap: 0.5rem;">
        <div class="d-flex flex-column justify-content-center mr-2">Seleccionar grupo:</div>
        <nb-select placeholder="Seleccionar grupo" [selected]="selectedGroup ? selectedGroup.id : null">
            <nb-option *ngFor="let group of groups" [value]="group.id" (click)="onGroupSelected(group)">{{group.name}}</nb-option>
        </nb-select>
        <div nbTooltip="Eliminar grupo" *ngIf="selectedGroup">
            <button nbButton ghost status="primary" (click)="openRemoveGroupDialog()">
                <nb-icon icon="trash-2-outline"></nb-icon>
            </button>
        </div>
    </div>
    <div *ngIf="members.length > 0" class="scrollable">
        <nb-card>
            <nb-card-header class="d-flex justify-content-between">
                Integrantes del grupo
                <div nbTooltip="Agregar integrante al grupo">
                    <button nbButton ghost status="primary" (click)="openAddMemberDialog()">
                        <nb-icon icon="plus-outline"></nb-icon>
                    </button>
                </div>
            </nb-card-header>
            <nb-list>
                <nb-list-item *ngFor="let member of members">
                    <div class="w-100 d-flex flex-column">
                        <div class="w-100 d-flex justify-content-between">
                            <div class="d-flex flex-column">
                                <div>
                                    <nb-icon icon="person-outline"></nb-icon>
                                    <b class="ml-2">{{member['name']}} {{member['lastName']}}</b>
                                </div>
                                <div>
                                    {{member['email']}}
                                </div>
                            </div>
                            <div class="d-flex">
                                <div *ngIf="!member.deletedAt" nbTooltip="Remover del grupo">
                                    <button class="ghost-btn" nbButton ghost (click)="openRemoveMemberDialog(member)">
                                        <nb-icon icon="minus-outline" status="primary"></nb-icon>
                                    </button>
                                </div>
                                <!--div *ngIf="!member.deletedAt" nbTooltip="Editar cuenta">
                                <button class="ghost-btn" nbButton ghost (click)="editmember(member)">
                                    <nb-icon icon="edit-outline" status="primary"></nb-icon>
                                </button>
                                </div>
                                <div *ngIf="!member.deletedAt" nbTooltip="Desactivar cuenta">
                                <button class="ghost-btn" nbButton ghost (click)="removemember(member.id)">
                                    <nb-icon icon="person-remove-outline" status="primary"></nb-icon>
                                </button>
                                </div>
                                <div *ngIf="member.deletedAt" nbTooltip="Reactivar cuenta">
                                <button class="ghost-btn" nbButton ghost (click)="reactivatemember(member)">
                                    <nb-icon icon="person-done-outline" status="success"></nb-icon>
                                </button>
                                </div-->
                            </div>
                        </div>
                    </div>
                </nb-list-item>
            </nb-list>
        </nb-card>
    </div>
</div>
<div class="d-flex justify-content-center" *ngIf="loading">
    <nb-spinner status="primary"></nb-spinner>
</div>
