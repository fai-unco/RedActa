<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Membretes</h1>
    <div nbTooltip="Agregar membrete">
        <button nbButton ghost status="primary" (click)="openEditHeadingDialog()">
            <nb-icon icon="plus-outline"></nb-icon>
        </button>
    </div>
</div>
<div class="d-flex mb-4">
    <div class="d-flex flex-column justify-content-center mr-2">Seleccionar dependencia:</div>
    <nb-select placeholder="Seleccionar dependencia" [(selected)]="selectedIssuerId" >
        <nb-option *ngFor="let issuer of issuers" (click)="selectIssuer(issuer.id)" [value]="issuer.id">{{issuer.description}}</nb-option>
    </nb-select>
</div>
<div class="scrollable">
    <nb-card *ngIf="headings.length > 0">    
        <nb-list>
            <nb-list-item *ngFor="let heading of headings">
                <div class="w-100 d-flex justify-content-between">
                    <div class="d-flex flex-column">
                        <b>{{heading.description}}</b>
                    </div>
                    <div class="d-flex">
                        <div nbTooltip="Editar membrete">
                            <button class="ghost-btn" nbButton ghost (click)="openEditHeadingDialog(heading)">
                                <nb-icon icon="edit-outline" status="primary"></nb-icon>
                            </button>
                        </div>
                        <div nbTooltip="Eliminar membrete">
                            <button class="ghost-btn" nbButton ghost (click)="openRemoveHeadingDialog(heading)">
                                <nb-icon icon="trash-2-outline" status="primary"></nb-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </nb-list-item>
        </nb-list> 
    </nb-card>
</div>
<div class="d-flex justify-content-center" *ngIf="loading">
    <nb-spinner status="primary"></nb-spinner>
</div>
