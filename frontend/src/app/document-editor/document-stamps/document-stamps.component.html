<div class="h-100">
    <nb-card class="h-100" *ngIf="viewState == 'loading'" [nbSpinner]="true" nbSpinnerStatus="primary">
      <nb-card-body>
      </nb-card-body>
    </nb-card>
    <div *ngIf="viewState == 'rendering'">
      <div class="flex-container">
        <div class="d-flex justify-content-end pb-2">
            <div class="d-flex align-items-center text-align-center">
                <div *ngIf="actionResult" class="mr-2 action-result fade-out">
                    {{actionResult}}   
                </div>
                <div class="mr-2" nbTooltip="Guardar">
                    <button class="ghost-btn" nbButton ghost (click)="submit()">
                        <nb-icon icon="save-outline" status="primary"></nb-icon>
                    </button>
                </div>
                <div nbTooltip="Exportar como PDF">
                    <button *ngIf="documentTypeId == 1" class="ghost-btn" nbButton ghost [nbContextMenu]="exportOptions" nbContextMenuTag="document-signatures-export-menu">
                        <nb-icon icon="download-outline" status="primary"></nb-icon>
                    </button>
                    <button *ngIf="documentTypeId != 1" class="ghost-btn" nbButton ghost (click)="export()">
                        <nb-icon icon="download-outline" status="primary"></nb-icon>
                    </button>
                </div>
            </div>
        </div>
        <div class="scrollable">
            <form [formGroup]="form">
                <ng-container formArrayName="stamps">
                    <nb-card>
                        <nb-card-header>
                            Sellos del documento actual
                        </nb-card-header>
                        <nb-card-body>
                            <div class="mb-4" *ngFor="let stamp of documentStamps.controls; let i = index">
                                <div class="d-flex justify-content-between pb-2">
                                    <label class="label col-form-label">Sello {{i + 1}}</label>
                                    <div nbTooltip="Acciones">
                                        <button class="ghost-btn" nbButton ghost [nbContextMenu]="stampOptions" [nbContextMenuTag]="'stamp-menu-' + i">
                                            <nb-icon icon="more-vertical-outline" status="primary"></nb-icon>
                                        </button>
                                    </div>
                                </div>
                                <app-text-editor [formControlName]="i"></app-text-editor>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button class="mr-2" nbButton ghost (click)="addStamp('')" nbTooltip="Agregar sello a continuación">
                                    <nb-icon icon="plus-outline" status="primary"></nb-icon>
                                </button>
                            </div>
                        </nb-card-body>
                    </nb-card>
                </ng-container>
            </form>
        </div>
      </div>
    </div>
    <div *ngIf="viewState == 'error'">
      Ha habido un problema al cargar los sellos de este documento. Intente recargar la página
    </div>
  </div>

  <ng-template #removeStampDialog let-data let-ref="dialogRef">
    <nb-card>
        <nb-card-header>Eliminar sello {{data.index+1}}?</nb-card-header>
        <nb-card-footer>
            <button nbButton status="danger" (click)="ref.close(true)" class="mr-4">Eliminar</button>
            <button nbButton (click)="ref.close(false)">Cancelar</button>
        </nb-card-footer>
    </nb-card>
</ng-template>
